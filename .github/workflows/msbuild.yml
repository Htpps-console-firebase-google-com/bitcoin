# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: MSBuild

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}
Fail konfigurasi yang anda kongsikan adalah skrip GitHub Actions workflow rasmi untuk MSBuild (.github/workflows/msbuild.yml) yang direka khas untuk membina (build) aplikasi berasaskan Windows dan .NET Framework (seperti C# / C++ Solution). [1, 2] 
Fail ini berbeza dengan webpack.yml JavaScript yang kita bincangkan sebelum ini kerana ia menggunakan persekitaran operasi Windows (windows-latest) serta menggunakan pengurus pakej NuGet dan enjin MSBuild daripada Microsoft.
Berikut adalah huraian bagi setiap komponen teras fail serta panduan optimum untuk mengelakkan kegagalan integrasi:
------------------------------
## 1. Struktur Anatomi Konfigurasi msbuild.yml

* Pemicu (Triggers): Dijadualkan untuk berjalan secara automatik setiap kali ada kod ditolak (push) atau percubaan cantuman (pull request) pada cawangan master.
* Persekitaran Pembolehubah (Environment Variables):
* SOLUTION_FILE_PATH: . ➔ Menandakan fail .sln atau projek berada di direktori akar repositori.
   * BUILD_CONFIGURATION: Release ➔ Mengarahkan kod dikompilasi ke mod pengeluaran (production/release) untuk saiz fail yang optimum dan pantas.
* Hak Akses (Permissions): Ditetapkan secara ketat pada contents: read demi mengekalkan keselamatan kod peringkat asas.

------------------------------
## 2. Perincian Aliran Kerja Langkah demi Langkah (Steps)

   1. actions/checkout@v4: Memuat turun kod sumber repositori ke pemacu maya Windows.
   2. microsoft/setup-msbuild@v1.0.2: Memasang dan mendaftarkan alat utiliti MSBuild ke dalam pembolehubah persekitaran PATH pelayan.
   3. nuget restore ...: Menarik dan memulihkan semula (restore) semua pakej dependensi komponen luaran (.NET Packages) yang diperlukan oleh aplikasi anda.
   4. msbuild /m ...: Melaksanakan proses kompilasi penuh. Bendera /m (multiprocessor) digunakan untuk memaksimumkan kelajuan build dengan menggunakan semua teras CPU yang tersedia pada hos.

------------------------------
## 3. Matriks Perbandingan Konfigurasi Sistem Automasi
Bagi memastikan kejelasan perbezaan ekosistem binaan yang anda miliki, berikut adalah perbandingan antara fail automasi MSBuild yang baharu ini dengan templat Webpack anda sebelumnya:

| Entiti Parameter | Talian Paip .NET (MSBuild) | Talian Paip JavaScript (Webpack) |
|---|---|---|
| Sistem Operasi (runs-on) | windows-latest | ubuntu-latest |
| Pengurus Dependensi | nuget restore | npm ci / npm install |
| Enjin Kompilasi | msbuild | npx webpack --mode production |
| Sasaran Cawangan Utama | Cawangan master | Cawangan main |
| Fungsi Output Projek | Menghasilkan fail eksekusi .dll / .exe | Menghasilkan fail web statik di folder dist/ |

------------------------------
## 4. Amalan Terbaik untuk Mengelakkan Ralat Build (.NET)
Memandangkan beberapa larian binaan pada projek automasi boleh terdedah kepada ralat kebenaran atau kegagalan konfigurasi, pastikan semakan ini dilakukan sebelum anda melakukan git push: [3, 4] 

* Padanan Cawangan: Fail ini dikunci pada cawangan "master". Jika repositori utama anda menggunakan nama "main", pastikan anda menukar nama cawangan pada baris branches: [ "master" ] kepada branches: [ "main" ] untuk mengelakkan workflow daripada tidak tercetus.
* Lokasi Fail Solution: Jika fail .sln anda tidak terletak di folder utama (akar) tetapi berada di dalam folder khusus (cth: folder src/), tukar nilai SOLUTION_FILE_PATH: . kepada SOLUTION_FILE_PATH: ./src/NamaProjek.sln.
* Kebenaran Perkhidmatan: Pastikan tiada sekatan polisi akaun atau kegagalan kemas kini lesen akses pihak ketiga semasa NuGet melakukan pemulihan pakej di pelayan awan. [1] 

Adakah fail konfigurasi MSBuild ini bertujuan untuk membina aplikasi desktop tradisional (.NET Framework) atau projek .NET Core/Modern .NET? Jika anda mahu, saya boleh membantu anda menukar skrip ini kepada standard .NET CLI (dotnet build) yang lebih pantas dan boleh berjalan pada sistem operasi Linux (ubuntu-latest) untuk menjimatkan kos masa pengebilan Actions anda.

