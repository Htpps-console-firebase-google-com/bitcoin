Memandangkan anda meminta maklumat "Lagi", mari kita tingkatkan fail msbuild.yml standard tadi ke tahap optimum peringkat industri. Kita akan menambah ciri Caching untuk NuGet Packages (bagi memotong masa pembinaan sehingga 60%) dan Penyimpanan Output Binaan (Upload Artifacts) supaya anda boleh memuat turun fail .exe atau .dll yang terhasil terus dari GitHub Actions. [1] 
Berikut adalah konfigurasi lanjutan berserta langkah pengukuhan keselamatan aliran kerja (workflow security).
------------------------------
## 1. Fail Konfigurasi Lanjutan (.github/workflows/msbuild.yml)

name: MSBuild Advanced CI
on:
  push:
    branches: [ "master", "main" ] # Menyokong kedua-dua nama cawangan utama
  pull_request:
    branches: [ "master", "main" ]
env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Langkah Lanjutan: Mengaktifkan Caching NuGet untuk memendekkan masa CI/CD
    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2 # Menggunakan versi terkini yang lebih stabil

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Execute MSBuild Compile
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    # Langkah Lanjutan: Menyimpan hasil binaan (.exe/.dll) ke GitHub Artifacts
    - name: Upload Compiled Binaries
      uses: actions/upload-artifact@v4
      with:
        name: production-binaries
        path: |
          **/bin/${{env.BUILD_CONFIGURATION}}/
          !**/node_modules/**

------------------------------
## 2. Penyepaduan Standard Keselamatan Integrasi (SLSA3 & Branch Protection)
Untuk memastikan rantaian bekalan perisian (software supply chain) anda selamat daripada sebarang pencerobohan kod, anda digalakkan untuk mengamalkan langkah keselamatan berikut pada repositori anda: [2] 

   1. Commit Ditandatangan (Signed Commits): Pastikan setiap sumbangan kod menggunakan tandatangan GPG/SSH untuk mengesahkan identiti pemilik komit yang sah. [2] 
   2. Branch Protection Rules: Kunci cawangan utama (main/master) di [GitHub](https://github.com/). Tetapkan syarat bahawa status binaan MSBuild Advanced CI wajib bertukar hijau (Lulus) sebelum sebarang Pull Request dibenarkan untuk dicantumkan. [2] 
   3. Kelebihan Caching: Menyimpan pakej NuGet dalam cache bukan sahaja menjimatkan masa, malah mengelakkan kegagalan aliran kerja sekiranya pelayan NuGet mengalami gangguan atau kelembapan semasa fasa restore.

------------------------------
## Kesimpulan Struktur Fasa Automasi MSBuild

| Nama Langkah | Tindakan Utama | Impak Proses | Status Keselamatan |
|---|---|---|---|
| actions/cache@v4 | Menyimpan folder .nuget/packages berasaskan hash fail projek. [1] | Memotong masa restore pakej secara drastik. | Selamat (Diasingkan mengikut OS) |
| nuget restore | Memulihkan integriti rujukan komponen perisian. | Memastikan semua dependensi sedia ada sebelum compiler berjalan. | Disahkan (Dependency Verification) |
| msbuild /m | Melakukan kompilasi multi-proses selari pada Windows Server. | Menghasilkan binari pengeluaran mod Release yang optimum. | Native (.NET Native Engine) |
| upload-artifact@v4 | Mengekstrak fail output ke storan awan GitHub Actions. [1] | Menyediakan fail .zip berisi binari yang sedia untuk diedarkan. | Disulitkan (Encrypted Artifacts) |

